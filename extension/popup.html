<!DOCTYPE html>
<html>
<head>
  <title>ChunkCheck Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #2ea44f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #2c974b;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #2ea44f;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <label for="apiUrl">ChunkCheck API URL:</label>
  <input type="url" id="apiUrl" placeholder="http://localhost:3004/api/analyze" />
  <button id="saveBtn">Save Settings</button>
  <div id="status">Settings saved!</div>

  <script src="popup.js"></script>
</body>
</html>
