name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the bundled GitHub Action is up to date
        run: |
          npm run build:action
          git diff --exit-code -- dist/ || (echo "dist/index.js is stale: run npm run build:action" && exit 1)
